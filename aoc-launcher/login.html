<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Architect of Creation — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:100vw; height:100vh; overflow:hidden; font-family:'Inter',sans-serif; color:#c4b59a; background:#0a0a0a; }

  /* ── Titlebar ── */
  .titlebar { position:fixed; top:0; left:0; right:0; height:32px; -webkit-app-region:drag; z-index:1000; display:flex; justify-content:flex-end; align-items:center; padding-right:4px; }
  .titlebar-btn { -webkit-app-region:no-drag; width:36px; height:28px; border:none; background:transparent; color:#666; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; font-family:'Segoe MDL2 Assets',sans-serif; }
  .titlebar-btn:hover { color:#fff; background:rgba(255,255,255,.1); }
  .titlebar-btn.close:hover { background:#c0392b; color:#fff; }

  /* ── Cinematic Background Slideshow ── */
  .slideshow { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
  .slide { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; transition:opacity 2s ease-in-out; }
  .slide.active { opacity:1; }
  .slide img { width:120%; height:120%; object-fit:cover; position:absolute; top:-10%; left:-10%; }
  .slide:nth-child(1) img { animation:ken1 20s ease-in-out infinite; }
  .slide:nth-child(2) img { animation:ken2 20s ease-in-out infinite; }
  .slide:nth-child(3) img { animation:ken3 20s ease-in-out infinite; }
  .slide:nth-child(4) img { animation:ken4 20s ease-in-out infinite; }
  .slide:nth-child(5) img { animation:ken5 20s ease-in-out infinite; }

  @keyframes ken1 { 0%{transform:scale(1) translate(0,0)} 50%{transform:scale(1.08) translate(-2%,-1%)} 100%{transform:scale(1) translate(0,0)} }
  @keyframes ken2 { 0%{transform:scale(1.05) translate(-3%,0)} 50%{transform:scale(1) translate(1%,-2%)} 100%{transform:scale(1.05) translate(-3%,0)} }
  @keyframes ken3 { 0%{transform:scale(1) translate(2%,-1%)} 50%{transform:scale(1.1) translate(-1%,1%)} 100%{transform:scale(1) translate(2%,-1%)} }
  @keyframes ken4 { 0%{transform:scale(1.08) translate(0,2%)} 50%{transform:scale(1) translate(-2%,-1%)} 100%{transform:scale(1.08) translate(0,2%)} }
  @keyframes ken5 { 0%{transform:scale(1) translate(-1%,1%)} 50%{transform:scale(1.06) translate(2%,-2%)} 100%{transform:scale(1) translate(-1%,1%)} }

  /* Dark vignette overlay */
  .vignette { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.2) 0%, rgba(0,0,0,.7) 70%, rgba(0,0,0,.92) 100%);
  }
  .gradient-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
    background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, transparent 30%, transparent 60%, rgba(0,0,0,.85) 100%);
  }

  /* ── Content ── */
  .content { position:relative; z-index:10; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* Logo */
  .logo-area { text-align:center; margin-bottom:40px; }
  .logo-crown { margin-bottom:12px; filter:drop-shadow(0 0 25px rgba(196,30,30,.5)); }
  .logo-title { font-family:'Cinzel Decorative','Cinzel',serif; font-size:42px; font-weight:900; color:#c41e1e; letter-spacing:10px; text-shadow:0 0 60px rgba(196,30,30,.3),0 4px 8px rgba(0,0,0,.8); line-height:1; }
  .logo-subtitle { font-family:'Cinzel',serif; font-size:11px; font-weight:600; letter-spacing:14px; color:#8a7350; margin-top:6px; text-shadow:0 2px 4px rgba(0,0,0,.6); }

  /* Login Box */
  .login-box { width:380px; background:rgba(15,10,8,.85); border:1px solid rgba(138,115,80,.2); border-radius:4px; padding:36px 32px 28px; backdrop-filter:blur(20px); box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(138,115,80,.1); }
  .login-box::before { content:''; position:absolute; top:-1px; left:20%; right:20%; height:1px; background:linear-gradient(90deg,transparent,rgba(196,30,30,.4),transparent); }

  .field-label { font-family:'Cinzel',serif; font-size:10px; font-weight:600; letter-spacing:3px; color:#6b5a42; margin-bottom:6px; text-transform:uppercase; }
  .field-input { width:100%; height:44px; background:rgba(0,0,0,.5); border:1px solid rgba(138,115,80,.2); border-radius:3px; padding:0 14px; color:#c4b59a; font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:all .3s; margin-bottom:18px; }
  .field-input:focus { border-color:rgba(196,30,30,.5); box-shadow:0 0 12px rgba(196,30,30,.15); }
  .field-input::placeholder { color:#3d3025; }

  .remember-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  .remember-row label { font-size:11px; color:#5a4d3a; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .remember-row input[type="checkbox"] { accent-color:#c41e1e; }
  .remember-row a { font-size:11px; color:#8a7350; text-decoration:none; transition:color .2s; }
  .remember-row a:hover { color:#c41e1e; }

  .btn-login { width:100%; height:48px; background:linear-gradient(180deg,#a01515,#7a0f0f); border:1px solid rgba(196,30,30,.4); border-radius:3px; color:#e8d5b5; font-family:'Cinzel',serif; font-size:15px; font-weight:700; letter-spacing:5px; cursor:pointer; text-transform:uppercase; transition:all .3s; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  .btn-login:hover { background:linear-gradient(180deg,#c41e1e,#8b0000); box-shadow:0 0 30px rgba(196,30,30,.3); transform:translateY(-1px); }
  .btn-login:active { transform:translateY(1px); }
  .btn-login:disabled { opacity:.5; cursor:not-allowed; transform:none; }

  .divider { display:flex; align-items:center; gap:12px; margin:20px 0 16px; }
  .divider span { font-size:9px; color:#3d3025; letter-spacing:3px; text-transform:uppercase; white-space:nowrap; }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(138,115,80,.2),transparent); }

  .btn-register { width:100%; height:40px; background:transparent; border:1px solid rgba(138,115,80,.2); border-radius:3px; color:#6b5a42; font-family:'Cinzel',serif; font-size:11px; font-weight:600; letter-spacing:4px; cursor:pointer; text-transform:uppercase; transition:all .3s; }
  .btn-register:hover { border-color:rgba(138,115,80,.4); color:#c4b59a; background:rgba(138,115,80,.05); }

  .error-msg { background:rgba(196,30,30,.1); border:1px solid rgba(196,30,30,.3); border-radius:3px; padding:10px 14px; margin-bottom:16px; font-size:12px; color:#e05050; display:none; text-align:center; }
  .error-msg.visible { display:block; }

  .loading-spinner { display:none; width:20px; height:20px; border:2px solid rgba(232,213,181,.2); border-top-color:#c41e1e; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Version */
  .version { position:fixed; bottom:10px; left:16px; font-size:9px; color:#2a1f14; letter-spacing:2px; z-index:10; }
  .copyright { position:fixed; bottom:10px; right:16px; font-size:9px; color:#2a1f14; letter-spacing:1px; z-index:10; }

  /* Floating particles */
  .particle { position:fixed; width:2px; height:2px; background:rgba(196,30,30,.6); border-radius:50%; z-index:2; opacity:0; animation:particle-float linear infinite; }
  @keyframes particle-float {
    0% { opacity:0; transform:translateY(0) translateX(0); }
    15% { opacity:.6; }
    85% { opacity:.2; }
    100% { opacity:0; transform:translateY(-100vh) translateX(var(--dx)); }
  }

  /* Slide indicators */
  .indicators { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:10; }
  .indicator { width:24px; height:3px; background:rgba(138,115,80,.2); border-radius:2px; transition:all .5s; cursor:pointer; }
  .indicator.active { background:rgba(196,30,30,.6); width:32px; }
</style>
</head>
<body>
  <div class="titlebar">
    <button class="titlebar-btn" onclick="aocAPI.minimize()">&#xE949;</button>
    <button class="titlebar-btn close" onclick="aocAPI.close()">&#xE106;</button>
  </div>

  <!-- Cinematic Slideshow -->
  <div class="slideshow" id="slideshow">
    <div class="slide active"><img src="img/bg-hero.jpg" alt=""></div>
    <div class="slide"><img src="img/bg-exploration.jpg" alt=""></div>
    <div class="slide"><img src="img/bg-magic-combat.jpg" alt=""></div>
    <div class="slide"><img src="img/bg-siege.jpg" alt=""></div>
    <div class="slide"><img src="img/bg-hero-v3.jpg" alt=""></div>
  </div>
  <div class="vignette"></div>
  <div class="gradient-overlay"></div>

  <!-- Main Content -->
  <div class="content">
    <div class="logo-area">
      <div class="logo-crown">
        <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Left sword -->
          <line x1="20" y1="80" x2="50" y2="15" stroke="#c41e1e" stroke-width="3" stroke-linecap="round"/>
          <line x1="20" y1="80" x2="50" y2="15" stroke="url(#swordGlow)" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
          <!-- Right sword -->
          <line x1="80" y1="80" x2="50" y2="15" stroke="#c41e1e" stroke-width="3" stroke-linecap="round"/>
          <line x1="80" y1="80" x2="50" y2="15" stroke="url(#swordGlow)" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
          <!-- Left crossguard -->
          <line x1="28" y1="60" x2="42" y2="55" stroke="#8a7350" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Right crossguard -->
          <line x1="72" y1="60" x2="58" y2="55" stroke="#8a7350" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Center gem -->
          <circle cx="50" cy="42" r="5" fill="#c41e1e" opacity="0.9"/>
          <circle cx="50" cy="42" r="8" fill="none" stroke="#c41e1e" stroke-width="0.5" opacity="0.4"/>
          <!-- Sword tips -->
          <circle cx="50" cy="13" r="2" fill="#c41e1e" opacity="0.8"/>
          <!-- Glow defs -->
          <defs>
            <linearGradient id="swordGlow" x1="20" y1="80" x2="50" y2="15" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#8a7350"/>
              <stop offset="100%" stop-color="#c41e1e"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="logo-title">Architect of Creation</div>
      <div class="logo-subtitle">Forge Your Legacy</div>
    </div>

    <div class="login-box">
      <div class="error-msg" id="errorMsg"></div>
      <div class="field-label">Username</div>
      <input class="field-input" type="text" id="username" placeholder="Enter your username" autocomplete="off" spellcheck="false">
      <div class="field-label">Password</div>
      <input class="field-input" type="password" id="password" placeholder="Enter your password">
      <div class="remember-row">
        <label><input type="checkbox" id="remember" checked> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn-login" id="loginBtn" onclick="doLogin()">Enter the Realm</button>
      <div class="loading-spinner" id="spinner"></div>
      <div class="divider"><span>or</span></div>
      <button class="btn-register" onclick="doRegister()">Create Account</button>
    </div>
  </div>

  <!-- Slide Indicators -->
  <div class="indicators" id="indicators"></div>

  <div class="version">v0.1.0-alpha</div>
  <div class="copyright">© 2025 Architect of Creation</div>

  <script>
    // ── Slideshow ──
    const slides = document.querySelectorAll('.slide');
    const indContainer = document.getElementById('indicators');
    let current = 0;

    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'indicator' + (i === 0 ? ' active' : '');
      dot.onclick = () => goToSlide(i);
      indContainer.appendChild(dot);
    });

    function goToSlide(n) {
      slides[current].classList.remove('active');
      indContainer.children[current].classList.remove('active');
      current = n;
      slides[current].classList.add('active');
      indContainer.children[current].classList.add('active');
    }

    setInterval(() => {
      goToSlide((current + 1) % slides.length);
    }, 7000);

    // ── Floating Particles ──
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '-5px';
      p.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      p.style.animationDuration = (5 + Math.random() * 8) + 's';
      p.style.animationDelay = Math.random() * 10 + 's';
      p.style.width = (1 + Math.random() * 2) + 'px';
      p.style.height = p.style.width;
      document.body.appendChild(p);
    }

    // ── Login Logic ──
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const errorMsg = document.getElementById('errorMsg');

    // Load saved credentials
    const saved = localStorage.getItem('aoc_remember');
    if (saved) {
      try {
        const d = JSON.parse(saved);
        usernameEl.value = d.username || '';
        passwordEl.value = d.password || '';
      } catch(e) {}
    }

    // Enter key
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    usernameEl.addEventListener('keydown', e => { if (e.key === 'Enter') passwordEl.focus(); });

    async function doLogin() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      errorMsg.classList.remove('visible');

      if (!username) { showError('Please enter your username'); usernameEl.focus(); return; }
      if (!password) { showError('Please enter your password'); passwordEl.focus(); return; }

      loginBtn.disabled = true;
      loginBtn.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const result = await aocAPI.login(username, password);
        if (result.success) {
          // Save credentials if remember checked
          if (document.getElementById('remember').checked) {
            localStorage.setItem('aoc_remember', JSON.stringify({ username, password }));
          } else {
            localStorage.removeItem('aoc_remember');
          }
          // Navigate to next screen
          aocAPI.navigate('character-flow');
        } else {
          showError(result.message || 'Login failed. Check your credentials.');
          loginBtn.disabled = false;
          loginBtn.style.display = 'block';
          spinner.style.display = 'none';
        }
      } catch (err) {
        showError('Connection failed. Is the server running?');
        loginBtn.disabled = false;
        loginBtn.style.display = 'block';
        spinner.style.display = 'none';
      }
    }

    async function doRegister() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      errorMsg.classList.remove('visible');

      if (!username) { showError('Choose a username first'); usernameEl.focus(); return; }
      if (!password) { showError('Choose a password first'); passwordEl.focus(); return; }
      if (password.length < 4) { showError('Password must be at least 4 characters'); return; }

      loginBtn.disabled = true;
      try {
        const result = await aocAPI.register(username, password);
        if (result.success) {
          showError('Account created! Logging in...'); // Reuse error box for success
          errorMsg.style.borderColor = 'rgba(30,196,30,.3)';
          errorMsg.style.color = '#50e050';
          errorMsg.style.background = 'rgba(30,196,30,.1)';
          setTimeout(() => doLogin(), 1000);
        } else {
          showError(result.message || 'Registration failed.');
          loginBtn.disabled = false;
        }
      } catch (err) {
        showError('Connection failed. Is the server running?');
        loginBtn.disabled = false;
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      errorMsg.style.borderColor = '';
      errorMsg.style.color = '';
      errorMsg.style.background = '';
    }
  </script>

  <!-- Theme music (quiet ambient on login) -->
  <audio id="loginTheme" autoplay loop preload="auto" style="display:none">
    <source src="assets/audio/aoc-theme.mp3" type="audio/mpeg">
  </audio>
  <script>
    // Start music quiet
    const loginAudio = document.getElementById('loginTheme');
    if (loginAudio) {
      loginAudio.volume = 0;
      loginAudio.play().catch(() => {});
      let fadeIn = setInterval(() => {
        if (loginAudio.volume < 0.25) loginAudio.volume = Math.min(0.25, loginAudio.volume + 0.005);
        else clearInterval(fadeIn);
      }, 100);
    }
  </script>

</body>
</html>
