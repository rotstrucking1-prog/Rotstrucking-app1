<title>Architect of Creation - World Prototype</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;color:#fff}
#loading h1{font-size:2em;margin-bottom:10px;color:#f0a030}
#loading p{font-size:1.1em;color:#aaa}
#bar-wrap{width:300px;height:8px;background:#333;border-radius:4px;margin-top:15px;overflow:hidden}

#hud{position:fixed;bottom:15px;left:15px;color:#fff;font-size:13px;text-shadow:1px 1px 2px #000;pointer-events:none;z-index:10;opacity:0.8}

#click-to-play span{background:rgba(0,0,0,0.7);color:#f0a030;padding:20px 40px;border-radius:10px;font-size:1.4em;border:2px solid #f0a030}

#joystick-zone{position:fixed;bottom:30px;left:30px;width:140px;height:140px;border-radius:50%;border:3px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.2);display:none;z-index:20}
#joystick-thumb{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(240,160,48,0.8);left:45px;top:45px;pointer-events:none}
.touch-btn{position:fixed;width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.3);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;z-index:20;-webkit-user-select:none;user-select:none}
#btn-jump{bottom:30px;right:30px}
#btn-sprint{bottom:100px;right:30px}
#btn-camera{bottom:30px;right:100px}
#btn-cast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;background:rgba(240,160,48,0.6);border:3px solid rgba(240,160,48,0.9);color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:bold;z-index:20;-webkit-user-select:none;user-select:none;transition:all 0.2s}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
// Catch module-level errors (modules fail silently without this)
window.addEventListener('error', function(e){
  var ld = document.getElementById('loading');
  if(ld) { var p = ld.querySelector('p'); if(p) p.textContent = 'Error: ' + e.message; }
});
window.addEventListener('unhandledrejection', function(e){
  var ld = document.getElementById('loading');
  if(ld) { var p = ld.querySelector('p'); if(p) p.textContent = 'Load error: ' + (e.reason || 'unknown'); }
});
// Safety timeout - if still loading after 15s, show what happened
setTimeout(function(){
  var ld = document.getElementById('loading');
  if(ld && ld.style.display !== 'none'){
    var p = ld.querySelector('p');
    if(p && p.textContent === 'Loading world...') p.textContent = 'Still loading... (slow connection?)';
  }
}, 15000);

// Force start if stuck after 40s
setTimeout(function(){
  if(document.getElementById('loading').style.display !== 'none'){
    console.warn('Force-starting world after timeout');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('click-to-play').style.display = 'flex';
  }
}, 40000);
</script>
</head>
<body>
<div id="loading">
  <h1>Architect of Creation</h1>
  <p id="load-text">Loading world...</p>
  <div id="bar-wrap"><div id="bar"></div></div>
</div>

<div id="hp-bar-container" style="position:fixed;top:10px;left:10px;width:200px;height:22px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.4);border-radius:4px;z-index:20;overflow:hidden">

</div>

<div id="btn-skin" style="position:fixed;bottom:180px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:rgba(180,120,50,0.6);border:3px solid rgba(180,120,50,0.9);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:bold;z-index:20;-webkit-user-select:none;user-select:none">Skin</div>
<div id="loot-popup" style="position:fixed;bottom:120px;left:50%;transform:translateX(-50%);color:#ffdd44;font-size:16px;font-weight:bold;text-shadow:1px 1px 3px #000;z-index:20;text-align:center;pointer-events:none;display:none"></div>
<div id="hud">
  <div id="hud-pos">Position: 0, 0, 0</div>
  <div id="hud-fps">FPS: 0</div>

</div>

<div id="joystick-zone"><div id="joystick-thumb"></div></div>

<div class="touch-btn" id="btn-sprint">Run</div>
<div class="touch-btn" id="btn-camera">Cam</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ===== SCENE =====
const scene = new THREE.Scene();

// Debug logging to on-screen panel
function debugLog(msg) {
  const el = document.getElementById('debugLog');
  if(el) el.innerHTML += msg + '<br>';
  console.log('[DEBUG]', msg);
}

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
// renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,2000);
const clock = new THREE.Clock();
const loader = new GLTFLoader();

// ===== LOADING MANAGER =====
let assetsLoaded = 0;
const totalAssets = 10;  // Character, Bass, Fishing Pole, Grass, Sun, Terrain, Deer, Rock Piles, Bears, Dead Grizzly
function updateLoading(txt,pct){
  document.getElementById('load-text').textContent = txt;
  document.getElementById('bar').style.width = pct+'%';
}

// World ready check - MUST be declared before any asset loading callbacks
let worldReady = false;
function checkReady(){
  if(worldReady) return;
  if(assetsLoaded >= totalAssets){
    worldReady = true;
    // Test bears spawned from dead bear loader callback below
    updateLoading('Ready!', 100);
    setTimeout(function(){
      document.getElementById('loading').style.display = 'none';
      if('ontouchstart' in window){
        showTouchControls();
      } else {
        document.getElementById('click-to-play').style.display = 'flex';
      }
    }, 500);
  }
}

// ===== LIGHTING =====
// Load Brad's sky texture as panoramic background
const skyLoader = new THREE.TextureLoader();
const skyTex = skyLoader.load('sky-texture.jpg?v=8', function(){
  // Once loaded, apply it
  scene.background = skyTex;
}, undefined, function(){
  // Fallback to blue if sky fails to load
  console.warn('Sky texture failed to load, using fallback blue');
  scene.background = new THREE.Color(0x87CEEB);
});

// Map equirectangular texture to proper format
skyTex.mapping = THREE.EquirectangularReflectionMapping;
skyTex.colorSpace = THREE.SRGBColorSpace;

scene.fog = new THREE.FogExp2(0x87CEEB, 0.0015);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 6.0);  // Brighter light from sun
sunLight.position.set(400, 600, 300);  // Very far away
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -500;
sunLight.shadow.camera.right = 500;
sunLight.shadow.camera.top = 500;
sunLight.shadow.camera.bottom = -500;
sunLight.shadow.camera.far = 1500;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x88bbff, 0x445522, 0.6);
scene.add(hemiLight);

// ===== TERRAIN =====
const WORLD_SIZE = 800;
const TERRAIN_SEG = 200;
const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI/2);

function getHeight(x, z) {
  let h = 0;
  h += Math.sin(x*0.008)*Math.cos(z*0.008)*12;
  h += Math.sin(x*0.02+1.3)*Math.cos(z*0.015+0.7)*5;
  h += Math.sin(x*0.05)*Math.cos(z*0.04)*2;
  h += Math.sin(x*0.003)*Math.cos(z*0.004)*25;
  return h;
}

// Compute terrain surface normal at (x,z) for slope alignment
function getTerrainNormal(x, z) {
  const d = 0.5; // sample distance
  const hL = getHeight(x - d, z);
  const hR = getHeight(x + d, z);
  const hD = getHeight(x, z - d);
  const hU = getHeight(x, z + d);
  const normal = new THREE.Vector3(hL - hR, 2 * d, hD - hU);
  normal.normalize();
  return normal;
}

const verts = terrainGeo.attributes.position.array;
for(let i=0;i<verts.length;i+=3){
  verts[i+1] = getHeight(verts[i], verts[i+2]);
}
terrainGeo.computeVertexNormals();

// Load Brad's grass texture and tile it across terrain
const texLoader = new THREE.TextureLoader();
const grassTex = texLoader.load('grass-texture.jpg?v=8');
grassTex.wrapS = THREE.RepeatWrapping;
grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(40, 40);
grassTex.minFilter = THREE.LinearMipmapLinearFilter;
grassTex.magFilter = THREE.LinearFilter;
grassTex.anisotropy = 4;

// Vertex colors for elevation blending (rocky hills, dirt paths)
const colors = new Float32Array(verts.length);
for(let i=0;i<verts.length;i+=3){
  const h = verts[i+1];
  if(h < -3){colors[i]=0.6;colors[i+1]=0.75;colors[i+2]=0.6}
  else if(h < 8){colors[i]=1.0;colors[i+1]=1.0;colors[i+2]=1.0}
  else if(h < 18){const t=(h-8)/10;colors[i]=1.0-t*0.35;colors[i+1]=1.0-t*0.3;colors[i+2]=1.0-t*0.4}
  else{colors[i]=0.65;colors[i+1]=0.6;colors[i+2]=0.45}
}
terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const terrainMat = new THREE.MeshLambertMaterial({map:grassTex, vertexColors:true});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);
updateLoading('Terrain generated...', 20);

// ===== WATER =====
const waterGeo = new THREE.PlaneGeometry(WORLD_SIZE*2, WORLD_SIZE*2);
waterGeo.rotateX(-Math.PI/2);

// Load Brad's water texture with tiling and animation support
const waterTexLoader = new THREE.TextureLoader();
const waterTex = waterTexLoader.load('water-texture.jpg?v=8');
waterTex.wrapS = THREE.RepeatWrapping;
waterTex.wrapT = THREE.RepeatWrapping;
waterTex.repeat.set(8, 8);
waterTex.minFilter = THREE.LinearMipmapLinearFilter;
waterTex.magFilter = THREE.LinearFilter;
waterTex.anisotropy = 4;

const waterMat = new THREE.MeshPhongMaterial({
  map: waterTex,
  color: 0x4488cc,
  transparent: true,
  opacity: 0.7,
  shininess: 120,
  side: THREE.DoubleSide
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = -6;
water.userData.isWater = true;
scene.add(water);

// ===== TREES (Brad's GLB Model) =====
updateLoading('Loading tree model...', 30);
loader.load('tree-model.glb?v=8', function(gltf){
  const treeTemplate = gltf.scene;
  const treeCount = 0; // Trees removed per Brad's request
  debugLog('🌲 TREE model loaded, meshes found');
  
  // Fix materials on template
  treeTemplate.traverse(function(child){
    if(child.isMesh && child.material){
      child.material.metalness = 0;
      child.material.roughness = 0.8;
      if(child.material.metalnessMap) child.material.metalnessMap = null;
      if(child.material.roughnessMap) child.material.roughnessMap = null;
      if(child.material.aoMap) child.material.aoMap = null;
      child.material.needsUpdate = true;
    }
  });
  
  let treesPlaced = 0;
  for(let i = 0; i < treeCount; i++){
    const x = (Math.random()-0.5)*WORLD_SIZE*0.9;
    const z = (Math.random()-0.5)*WORLD_SIZE*0.9;
    const h = getHeight(x,z);
    if(h < -2 || h > 28) continue;
    const t = treeTemplate.clone();
    const scale = 32 + Math.random()*48;
    t.scale.set(scale, scale, scale);
    // Align tree to terrain slope so base meshes with ground on hills
    const terrainNormal = getTerrainNormal(x, z);
    const up = new THREE.Vector3(0, 1, 0);
    const slopeQuat = new THREE.Quaternion().setFromUnitVectors(up, terrainNormal);
    // Apply random Y rotation first, then slope alignment
    const yRotQuat = new THREE.Quaternion().setFromAxisAngle(up, Math.random()*Math.PI*2);
    slopeQuat.multiply(yRotQuat);
    t.quaternion.copy(slopeQuat);
    // Position at terrain, then lift along LOCAL up axis (works correctly on slopes)
    t.position.set(x, h, z);
    const treeLocalUp = new THREE.Vector3(0, 0.1 * scale, 0);
    treeLocalUp.applyQuaternion(slopeQuat);
    t.position.add(treeLocalUp);
    t.castShadow = true;
    scene.add(t);
    treesPlaced++;
  }
  debugLog('🌲 Trees placed: ' + treesPlaced + '/' + treeCount);
  assetsLoaded++;
  updateLoading('Trees planted!', 40);
  checkReady();
}, undefined, function(err){
  debugLog('❌ Tree load FAILED: ' + err);
  console.warn('Tree load error:', err);
  assetsLoaded++;
  checkReady();
});

// ===== PILE OF ROCKS (ENV-0005 - Brad's GLB Model) =====
updateLoading('Loading rock piles...', 44);
loader.load('rock-pile-model.glb?v=1', function(gltf){
  const rockTemplate = gltf.scene;
  rockTemplate.traverse(function(child){
    if(child.isMesh){
      child.material = child.material.clone();
      child.material.metalness = 0;
      child.material.roughness = 0.8;
      if(child.material.color) child.material.color.set(0xffffff);
      child.castShadow = true;
    }
  });
  // Rock pile model: reduced offset so base sits on ground (not floating)
  const ROCK_FOOT_OFFSET = 0.05;
  for(let i = 0; i < 100; i++){
    const x = (Math.random()-0.5) * WORLD_SIZE * 0.9;
    const z = (Math.random()-0.5) * WORLD_SIZE * 0.9;
    const h = getHeight(x, z);
    const s = 1.5 + Math.random() * 3.0; // Scale 1.5–4.5
    const pile = rockTemplate.clone();
    pile.scale.set(s, s, s);
    pile.rotation.y = Math.random() * Math.PI * 2; // Random rotation for variety
    // Slope alignment
    const normal = getTerrainNormal(x, z);
    const up = new THREE.Vector3(0, 1, 0);
    const quat = new THREE.Quaternion().setFromUnitVectors(up, normal);
    pile.quaternion.copy(quat);
    // Position at terrain height, then lift along local Y so base sits on ground
    pile.position.set(x, h, z);
    const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(quat);
    pile.position.addScaledVector(localUp, ROCK_FOOT_OFFSET * s);
    scene.add(pile);
  }
  assetsLoaded++;
  debugLog('🪨 Rock piles placed: 100');
  updateLoading('Rock piles scattered!', 45);
}, undefined, function(err){
  console.warn('Rock pile load error:', err);
  assetsLoaded++;
});


// ===== IRON ORE DEPOSITS (Brad's GLB Model - ENV-0003) =====
updateLoading('Loading iron ore deposits...', 47);
loader.load('iron-ore-deposit.glb?v=8', function(gltf){
  var oreTemplate = gltf.scene;
  var oreCount = 80;
  debugLog('⛏️ ORE model loaded');
  
  oreTemplate.traverse(function(child){
    if(child.isMesh && child.material){
      child.material.metalness = 0;
      child.material.roughness = 0.8;
      if(child.material.metalnessMap) child.material.metalnessMap = null;
      if(child.material.roughnessMap) child.material.roughnessMap = null;
      if(child.material.aoMap) child.material.aoMap = null;
      child.material.needsUpdate = true;
    }
  });
  
  let oresPlaced = 0;
  for(var i = 0; i < oreCount; i++){
    var x = (Math.random()-0.5)*WORLD_SIZE*0.85;
    var z = (Math.random()-0.5)*WORLD_SIZE*0.85;
    var h = getHeight(x,z);
    if(h < 2 || h > 25) continue;
    var ore = oreTemplate.clone();
    var scale = 0.7 + Math.random()*1.0;
    ore.scale.set(scale, scale, scale);
    // Align ore to terrain slope
    var oreNormal = getTerrainNormal(x, z);
    var oreUp = new THREE.Vector3(0, 1, 0);
    var oreSlopeQuat = new THREE.Quaternion().setFromUnitVectors(oreUp, oreNormal);
    var oreYRotQuat = new THREE.Quaternion().setFromAxisAngle(oreUp, Math.random()*Math.PI*2);
    oreSlopeQuat.multiply(oreYRotQuat);
    ore.quaternion.copy(oreSlopeQuat);
    ore.position.set(x, h, z);
    const oreLocalUp = new THREE.Vector3(0, 0.05 * scale, 0);
    oreLocalUp.applyQuaternion(oreSlopeQuat);
    ore.position.add(oreLocalUp);
    ore.castShadow = true;
    scene.add(ore);
    oresPlaced++;
  }
  debugLog('⛏️ Ore placed: ' + oresPlaced);
  assetsLoaded++;
  updateLoading('Iron ore veins discovered!', 48);
  checkReady();
}, undefined, function(err){
  debugLog('❌ Ore load FAILED: ' + err);
  console.warn('Iron ore load error:', err);
  assetsLoaded++;
  checkReady();
});

// Load BASS model (NPC-0001 Baby, NPC-0002 Medium, NPC-0003 Full Grown, NPC-0004 Overgrown)
loader.load('bass-model.glb?v=8', function(gltf){
  const bassTemplate = gltf.scene;
  debugLog('🐟 BASS model loaded, traversing...');
      bassTemplate.traverse(function(child){
    if(child.isMesh){
      child.castShadow = true;
      child.receiveShadow = true;
      if(child.material){
        child.material.metalness = 0;
        child.material.roughness = 0.8;
        if(child.material.metalnessMap) child.material.metalnessMap = null;
        if(child.material.roughnessMap) child.material.roughnessMap = null;
        if(child.material.aoMap) child.material.aoMap = null;
        child.material.needsUpdate = true;
      }
    }
  });
  
  // Spawn bass throughout water areas
  for(let i = 0; i < bassCount; i++){
    let x, z, h;
    let attempts = 0;
    do {
      x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
      z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
      h = getHeight(x, z);
      attempts++;
    } while(h > -7 && attempts < 200); // Water areas (wider range, more attempts)
    
    if(h < -7){
      const bass = bassTemplate.clone();
      bass.position.set(x, -7.75, z);  // 25% lower below water surface
      bass.rotation.y = Math.random() * Math.PI * 2;
      
      // Select bass variant with separate NPC IDs
      let fishScale;
      let npcId;
      const rand = Math.random();
      if(rand < 0.05) {
        // NPC-0004: Overgrown Bass (5% chance) — 0.45-0.55
        npcId = 'NPC-0004';
        fishScale = 4.5 + Math.random() * 1.5;
      } else if(rand < 0.35) {
        // NPC-0001: Baby Bass (30% chance) — 0.08-0.12
        npcId = 'NPC-0001';
        fishScale = 0.75 + Math.random() * 0.375;
      } else if(rand < 0.75) {
        // NPC-0002: Medium Bass (40% chance) — 0.18-0.25
        npcId = 'NPC-0002';
        fishScale = 1.5 + Math.random() * 0.75;
      } else {
        // NPC-0003: Full Grown Bass (25% chance) — 0.30-0.40
        npcId = 'NPC-0003';
        fishScale = 2.625 + Math.random() * 1.125;
      }
      
      bass.scale.set(fishScale, fishScale, fishScale);
      bass.userData.npcId = npcId;
      scene.add(bass);

updateLoading('Loading deer...', 53);
loader.load('deer-model.glb?v=2', function(gltf){
  const deerTemplate = gltf.scene;
  const deerAnimClips = gltf.animations; // 5 animations from rigged model
  debugLog('🦌 DEER rigged model loaded! Animations: ' + deerAnimClips.map(a => a.name).join(', '));
  deerTemplate.traverse(function(child){
    if(child.isMesh){
      child.castShadow = true;
      child.receiveShadow = true;
      if(child.material){
        child.material = child.material.clone();
        child.material.metalness = 0;
        child.material.roughness = 0.8;
        if(child.material.metalnessMap) child.material.metalnessMap = null;
        if(child.material.roughnessMap) child.material.roughnessMap = null;
        if(child.material.aoMap) child.material.aoMap = null;
        child.material.needsUpdate = true;
      }
    }
  });
  
  // Find animation clips by name
  function findClip(name) {
    for(var i = 0; i < deerAnimClips.length; i++){
      if(deerAnimClips[i].name === name) return deerAnimClips[i];
    }
    return null;
  }
  const clipIdle = findClip('Idle_Head_Look_Around');
  const clipWalk = findClip('Walk_InPlace_Loop');
  const clipRun = findClip('Run_InPlace_Loop');
  const clipGraze = findClip('Graze_Eating_Loop');
  
  // Spawn deer on land areas
  let deerPlaced = 0;
  for(let i = 0; i < deerCount * 3 && deerPlaced < deerCount; i++){
    const x = (Math.random() - 0.5) * WORLD_SIZE * 0.85;
    const z = (Math.random() - 0.5) * WORLD_SIZE * 0.85;
    const h = getHeight(x, z);
    if(h < -2 || h > 28) continue; // Land only
    
    // Use SkeletonUtils.clone for proper skinned mesh cloning
    const deer = SkeletonUtils.clone(deerTemplate);
    const scale = 2.5 + Math.random() * 1.5; // Scale 2.5-4.0
    deer.scale.set(scale, scale, scale);
    
    // Align to terrain slope
    const deerNormal = getTerrainNormal(x, z);
    const deerUp = new THREE.Vector3(0, 1, 0);
    const deerSlopeQuat = new THREE.Quaternion().setFromUnitVectors(deerUp, deerNormal);
    const heading = Math.random() * Math.PI * 2;
    const deerYRotQuat = new THREE.Quaternion().setFromAxisAngle(deerUp, heading);
    deerSlopeQuat.multiply(deerYRotQuat);
    deer.quaternion.copy(deerSlopeQuat);
    
    // Position with foot offset
    deer.position.set(x, h, z);
    const deerLocalUp = new THREE.Vector3(0, 0.05 * scale, 0);
    deerLocalUp.applyQuaternion(deerSlopeQuat);
    deer.position.add(deerLocalUp);
    
    scene.add(deer);
    deerModels.push(deer);
    
    // Create AnimationMixer for this deer
    const mixer = new THREE.AnimationMixer(deer);
    const actions = {};
    if(clipWalk) actions.walk = mixer.clipAction(clipWalk);
    if(clipRun) actions.run = mixer.clipAction(clipRun);
    if(clipIdle) actions.idle = mixer.clipAction(clipIdle);
    if(clipGraze) actions.graze = mixer.clipAction(clipGraze);
    
    // Set all to loop
    Object.values(actions).forEach(function(a){ a.setLoop(THREE.LoopRepeat); });
    
    // Start with walk animation
    const startState = Math.random() < 0.3 ? 'idle' : 'wandering';
    if(startState === 'idle' && actions.idle){
      actions.idle.play();
    } else if(actions.walk){
      actions.walk.play();
    }
    
    deerData.push({
      model: deer,
      scale: scale,
      heading: heading,
      state: startState,
      walkSpeed: 1.5 + Math.random() * 1.0,
      turnTimer: 0,
      turnInterval: 5 + Math.random() * 5,
      turnTarget: heading,
      spookTimer: 0,
      idleTimer: startState === 'idle' ? 5 + Math.random() * 10 : 0,
      time: Math.random() * Math.PI * 2,
      mixer: mixer,
      actions: actions,
      currentAction: startState === 'idle' ? 'idle' : 'walk'
    });
    
    deerPlaced++;
  }
  
  debugLog('🦌 Deer spawned: ' + deerPlaced + '/' + deerCount + ' (rigged + animated!)');
  assetsLoaded++;
  updateLoading('Deer roaming the lands!', 56);
  checkReady();
}, undefined, function(err){
  console.warn('Deer load error:', err);
  assetsLoaded++;
  checkReady();
});

function spawnBlood(position, count, scale){
  for(let i = 0; i < count; i++){
    let bp;
    // Reuse dead particles from pool
    const dead = bloodParticles.findIndex(function(p){ return p.life <= 0; });
    if(dead >= 0){
      bp = bloodParticles[dead];
    } else if(bloodParticles.length < BLOOD_POOL_SIZE){
      const mesh = new THREE.Mesh(bloodGeo, bloodMat.clone());
      bp = { mesh: mesh, vx:0, vy:0, vz:0, life:0 };
      bloodParticles.push(bp);
      scene.add(mesh);
    } else {
      continue;
    }
    const sz = (0.1 + Math.random() * 0.3) * (scale || 1);
    bp.mesh.scale.set(sz, sz, sz);
    bp.mesh.position.set(
      position.x + (Math.random()-0.5) * 2,
      position.y + Math.random() * 2,
      position.z + (Math.random()-0.5) * 2
    );
    // Squirt outward with velocity
    const angle = Math.random() * Math.PI * 2;
    const upForce = 3 + Math.random() * 5;
    const outForce = 2 + Math.random() * 4;
    bp.vx = Math.cos(angle) * outForce;
    bp.vy = upForce;
    bp.vz = Math.sin(angle) * outForce;
    bp.life = 0.8 + Math.random() * 0.7; // 0.8-1.5 seconds
    bp.maxLife = bp.life;
    bp.mesh.visible = true;
    bp.mesh.material.opacity = 1;
  }
}

function createFishingPole(){
  // Create a simple fishing pole (stick with handle)
  const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 4, 8);
  const poleMat = new THREE.MeshStandardMaterial({color: 0x8b4513, roughness: 0.7});

  fishingPole.castShadow = true;
  fishingPole.visible = false;
  scene.add(fishingPole);
  return fishingPole;
}

function createFishingBobber(){
  // Round bobber
  const bobberGeo = new THREE.SphereGeometry(0.08, 8, 8);
  const bobberMat = new THREE.MeshStandardMaterial({color: 0xff6600, emissive: 0xff4400, emissiveIntensity: 0.5});
  fishingBobber = new THREE.Mesh(bobberGeo, bobberMat);
  fishingBobber.castShadow = true;
  fishingBobber.visible = false;
  scene.add(fishingBobber);
  return fishingBobber;
}

function createFishingLine(){
  // Thin line geometry from pole to bobber
  fishingLineGeometry = new THREE.BufferGeometry();
  const positions = new Float32Array([
    0, 0, 0,  // pole tip
    0, -5, 0  // bobber (will update each frame)
  ]);
  fishingLineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const lineMat = new THREE.LineBasicMaterial({color: 0xcccccc, linewidth: 1});
  fishingLine = new THREE.Line(fishingLineGeometry, lineMat);
  fishingLine.visible = false;
  scene.add(fishingLine);
  return fishingLine;
}

function equipFishingPole(){
  if(!fishingPole){
    if(fishingPoleModel){
      // Use loaded model
      fishingPole = fishingPoleModel.clone();
      scene.add(fishingPole);
    } else {
      // Fallback to geometric pole
      createFishingPole();
    }
  }
  if(!fishingBobber) createFishingBobber();
  if(!fishingLine) createFishingLine();
  
  fishingEquipped = true;
  fishingPole.visible = true;
  // Position pole in right hand of player (offset from player position)
  updateFishingPolePosition();
}

function unequipFishingPole(){
  fishingEquipped = false;
  fishingState = 'idle';
  if(fishingPole) fishingPole.visible = false;
  if(fishingBobber) fishingBobber.visible = false;
  if(fishingLine) fishingLine.visible = false;
}

function updateFishingPolePosition(){
  if(!fishingPole || !fishingEquipped) return;
  
  // Position pole at player's right shoulder
  const poleOffsetRight = 0.6;
  const poleOffsetUp = 1.5;
  fishingPole.position.set(
    playerPos.x + Math.sin(characterYaw) * poleOffsetRight,
    playerPos.y + poleOffsetUp,
    playerPos.z + Math.cos(characterYaw) * poleOffsetRight
  );
  fishingPole.rotation.z = 0.4;  // Slight angle
}

function castFishingLine(){
  if(fishingState !== 'idle') return;
  
  fishingState = 'casting';
  fishingCastTime = 0;
  castStartPos.copy(fishingPole.position);
  
  // Random distance cast (based on "cast strength" - could be mouse input later)
  bobberDistance = 15 + Math.random() * 20;  // 15-35 units away
  
  // Random spot in front of player
  const castAngle = playerYaw + (Math.random() - 0.5) * 0.8;
  bobberX = playerPos.x + Math.cos(castAngle) * bobberDistance;
  bobberZ = playerPos.z + Math.sin(castAngle) * bobberDistance;
  
  // Must hit water
  const waterY = -6;
  if(getHeight(bobberX, bobberZ) > waterY + 1){
    // Land - recast to water nearby
    for(let i=0; i<5; i++){
      const testAngle = playerYaw + (Math.random() - 0.5) * 1.5;
      const testDist = 15 + Math.random() * 20;
      bobberX = playerPos.x + Math.cos(testAngle) * testDist;
      bobberZ = playerPos.z + Math.sin(testAngle) * testDist;
      if(getHeight(bobberX, bobberZ) <= waterY + 1) break;
    }
  }
  
  fishingBobber.visible = true;
  fishingLine.visible = true;
}

function findFishNearBobber(){
  // Find a random bass near the bobber
  let nearby = [];
  
  bassSwimData.forEach(function(data, idx){
    const dx = data.model.position.x - bobberX;
    const dz = data.model.position.z - bobberZ;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if(dist < FISH_DETECTION_RANGE){
      nearby.push({idx: idx, dist: dist, data: data});
    }
  });
  
  if(nearby.length === 0) return null;
  
  // Randomly pick one of the nearby fish
  const chosen = nearby[Math.floor(Math.random() * nearby.length)];
  return chosen;
}

function calculateCatchRate(npcId){
  // Catch rates based on NPC ID and skill level
  const skill = playerSkills.fishing;
  const skillFactor = skill / 100;  // 0.01 to 1.0
  
  let baseRate = 0;
  switch(npcId){
    case 1: baseRate = 0.03 + (0.52 * skillFactor); break;  // Baby: 3% → 55%
    case 2: baseRate = 0.0255 + (0.4425 * skillFactor); break;  // Medium: 2.55% → 47%
    case 3: baseRate = 0.0225 + (0.39 * skillFactor); break;  // Full Grown: 2.25% → 41.25%
    case 4: baseRate = 0.0165 + (0.286 * skillFactor); break;  // Overgrown: 1.65% → 30.25%
    default: baseRate = 0.03;
  }
  
  // Always a chance to fail, even at max skill
  baseRate = Math.min(baseRate, 0.99);
  return baseRate;
}

function attemptCatch(){
  if(!nearbyFish) return false;
  
  const rate = calculateCatchRate(fishNpcId);
  return Math.random() < rate;
}

function successfulCatch(){
  // Grant XP based on fish type
  let xpGain = 10;
  switch(fishNpcId){
    case 1: xpGain = 10; break;  // Baby Bass
    case 2: xpGain = 20; break;  // Medium Bass
    case 3: xpGain = 30; break;  // Full Grown Bass
    case 4: xpGain = 65; break;  // Overgrown Bass
  }
  
  playerSkills.fishing = Math.min(100, playerSkills.fishing + xpGain / 100);
  playerCaughtFish++;
  
  // Remove fish from world (it's caught)
  if(nearbyFish){
    scene.remove(nearbyFish.data.model);
    bassSwimData.splice(nearbyFish.idx, 1);
  }
  
  return xpGain;
}

function failedCatch(){
  // Fish escapes and swims away
  if(nearbyFish){
    nearbyFish.data.swimSpeed = 8;  // Swim away fast
    nearbyFish.data.heading += Math.PI;  // Turn around and flee
  }
}

function resetFishing(){
  fishingState = 'idle';
  nearbyFish = null;
  fishingBobber.visible = false;
  fishingLine.visible = false;
  fishingCastTime = 0;
  fishArrivalTime = 0;
}

function performPlayerAttack(){
  if(playerAttackCooldown > 0) return;
  playerAttackCooldown = PLAYER_ATTACK_COOLDOWN;
  
  // Find closest bear within attack range
  let closestDist = PLAYER_ATTACK_RANGE;
  let closestIdx = -1;
  for(let i = 0; i < bearData.length; i++){
    const bd = bearData[i];
    if(bd.state === 'dead') continue;
    const dx = playerPos.x - bd.model.position.x;
    const dz = playerPos.z - bd.model.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if(dist < closestDist){
      closestDist = dist;
      closestIdx = i;
    }
  }
  
  if(closestIdx >= 0){
    const bd = bearData[closestIdx];
    bd.hp -= PLAYER_ATTACK_DAMAGE;
    // BLOOD SQUIRT — particles fly out from hit point
    const bloodPos = bd.model.position.clone();
    bloodPos.y += bd.scale * 0.3; // Center-mass of bear
    spawnBlood(bloodPos, 12 + Math.floor(Math.random() * 8), bd.scale * 0.15);
    debugLog('⚔️ Hit ' + bd.variant.name + ' for ' + PLAYER_ATTACK_DAMAGE + ' dmg! HP: ' + Math.max(0,bd.hp) + '/' + bd.maxHp);
    
    // Make bear aggro if not already
    if(bd.state === 'wandering' || bd.state === 'idle'){
      bd.state = 'aggro';
    }
    
    if(bd.hp <= 0){
      bearDeath(closestIdx);
    }
  }
}

function bearDeath(idx){
  const bd = bearData[idx];
  bd.state = 'dead';
  bd.deathTimer = 999;
  bd.deathProgress = 1.0; // Instantly "done" — dead model replaces collapse animation
  bd.skinned = false;
  
  // Big blood burst on death
  const deathBloodPos = bd.model.position.clone();
  deathBloodPos.y += bd.scale * 0.3;
  spawnBlood(deathBloodPos, 25 + Math.floor(Math.random() * 15), bd.scale * 0.2);
  
  // Swap live bear model with dead grizzly carcass model
  const bearX = bd.model.position.x;
  const bearZ = bd.model.position.z;
  const terrainH = getHeight(bearX, bearZ);
  scene.remove(bd.model);
  
  if(deadBearTemplate){
    const deadModel = deadBearTemplate.clone();
    deadModel.traverse(function(child){
      if(child.isMesh){
        child.material = child.material.clone();
      }
    });
    deadModel.scale.set(bd.scale, bd.scale, bd.scale);
    
    // Lay flat on terrain — no slope rotation, back flat on ground
    deadModel.position.set(bearX, terrainH + DEAD_BEAR_FOOT_OFFSET * bd.scale, bearZ);
    deadModel.rotation.x = Math.PI; // flip onto back (belly up)
    // Random Y rotation so carcasses face different directions
    deadModel.rotation.y = Math.random() * Math.PI * 2;
    
    scene.add(deadModel);
    bd.model = deadModel;
  } else {
    // Fallback if dead model didn't load — keep old model
    bd.model.position.y = terrainH;
    scene.add(bd.model);
  }
  
  // Roll for drops but DON'T give them yet — stored for skinning
  const drops = [];
  BEAR_DROP_TABLE.forEach(function(drop){
    if(Math.random() < drop.chance){
      drops.push(drop.item);
    }
  });
  bd.pendingDrops = drops;
  bd.pendingXP = bd.variant.xp;
  
  showLootNotification(bd.variant.name + ' killed! Skin it for loot.');
  debugLog('💀 ' + bd.variant.name + ' died! Walk up and press E to skin.');
}

function startSkinning(bearIdx){
  if(skinningState === 'skinning') return;
  skinningState = 'skinning';
  skinningTarget = bearIdx;
  skinningProgress = 0;
  document.getElementById('skin-prompt-text').textContent = 'Skinning...';
  document.getElementById('skin-progress-bar').style.display = 'block';
  document.getElementById('skin-progress-fill').style.width = '0%';
}

function completeSkinning(){
  const bd = bearData[skinningTarget];
  bd.skinned = true;
  
  // Award XP
  playerXP += bd.pendingXP;
  
  // Award drops to inventory
  const drops = bd.pendingDrops || [];
  drops.forEach(function(item){
    if(!playerInventory[item]) playerInventory[item] = 0;
    playerInventory[item]++;
  });
  
  const dropText = drops.length > 0 ? drops.join(', ') : 'Nothing';
  showLootNotification('Skinned ' + bd.variant.name + '! +' + bd.pendingXP + ' XP | Loot: ' + dropText);
  debugLog('🔪 Skinned ' + bd.variant.name + '! Drops: ' + dropText);
  
  // Carcass stays for 5 minutes then fades
  bd.carcassTimer = 300; // 5 minutes in seconds
  bd.fadeTimer = 0;
  
  // Reset skinning state
  skinningState = 'idle';
  skinningTarget = -1;
  skinningProgress = 0;
  document.getElementById('skin-prompt').style.display = 'none';
  document.getElementById('skin-progress-bar').style.display = 'none';
}

  skinningState = 'idle';

// ===== GAME LOOP =====
let frameCount = 0;
let fpsTime = 0;
let fps = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  
  frameCount++;
  fpsTime += dt;
  if(fpsTime >= 0.5){fps=Math.round(frameCount/fpsTime);frameCount=0;fpsTime=0}
  
  let moveX = 0, moveZ = 0;
  isSprinting = keys['ShiftLeft'] || keys['ShiftRight'] || sprintTouch;
  
  if(isMobile && joystickActive){
    moveX = joystickX;
    moveZ = joystickY;
  } else {
    if(keys['KeyW']||keys['ArrowUp']) moveZ = -1;
    if(keys['KeyS']||keys['ArrowDown']) moveZ = 1;
    if(keys['KeyA']||keys['ArrowLeft']) moveX = -1;
    if(keys['KeyD']||keys['ArrowRight']) moveX = 1;
  }
  
  moveX = -moveX; // Swap left/right to match camera perspective
  if(moveX || moveZ){
    const len = Math.sqrt(moveX*moveX+moveZ*moveZ);
    if(len>1){moveX/=len;moveZ/=len}
    // Smoothly rotate body towards camera direction when moving
    let angleDiff = playerYaw - characterYaw;
    while(angleDiff > Math.PI) angleDiff -= 2*Math.PI;
    while(angleDiff < -Math.PI) angleDiff += 2*Math.PI;
    characterYaw += angleDiff * 0.15; // Smooth rotation towards camera direction
    const speed = playerSpeed * (isSprinting ? sprintMult : 1) * dt;
    const sin = Math.sin(playerYaw);
    const cos = Math.cos(playerYaw);
    playerPos.x += (moveX*cos - moveZ*sin) * speed;
    playerPos.z -= (moveX*sin + moveZ*cos) * speed;
  }
  lastMoveX = moveX;
  lastMoveZ = moveZ;
  
  if((keys['Space'] || false) && isGrounded){
    playerVelY = jumpForce;
    isGrounded = false;
  }
  
  playerVelY += gravity * dt;
  playerPos.y += playerVelY * dt;
  
  const groundH = getHeight(playerPos.x, playerPos.z);
  if(playerPos.y <= groundH + CHAR_HEIGHT_OFFSET){
    playerPos.y = groundH + CHAR_HEIGHT_OFFSET;
    playerVelY = 0;
    isGrounded = true;
  }
  
  const bound = WORLD_SIZE*0.48;
  playerPos.x = Math.max(-bound, Math.min(bound, playerPos.x));
  playerPos.z = Math.max(-bound, Math.min(bound, playerPos.z));
  
  if(playerModel){
    playerModel.position.copy(playerPos);
    playerModel.rotation.y = characterYaw - Math.PI * 0.5;  // -PI/2 offset — model forward corrected
  }
  playerPlaceholder.position.copy(playerPos);
  
  if(playerMixer) playerMixer.update(dt);
  
  // Procedural running animation
  animTime += dt;
  const moveSpeed = Math.sqrt(lastMoveX*lastMoveX + lastMoveZ*lastMoveZ);
  if(playerModel && moveSpeed > 0.01){
    const animSpeed = isSprinting ? 14 : 8; // Step frequency
    const animPhase = (animTime * animSpeed) % (Math.PI * 2);
    
    // --- Vertical bob (bouncy running feel) ---
    const bobHeight = isSprinting ? 0.35 : 0.2;
    const bob = Math.abs(Math.sin(animPhase)) * bobHeight;
    playerModel.position.y = playerPos.y + bob;
    
    // --- Forward lean (tilt into the run) ---
    const leanAngle = isSprinting ? 0.15 : 0.08; // radians
    // Lean is around local X axis relative to movement direction
    // We apply it as rotation on the X axis after setting Y rotation
    const facingAngle = characterYaw - Math.PI * 0.5;
    playerModel.rotation.y = facingAngle;
    playerModel.rotation.x = leanAngle;
    
    // --- Side-to-side sway (subtle weight shift) ---
    const swayAmount = isSprinting ? 0.06 : 0.04;
    playerModel.rotation.z = Math.sin(animPhase) * swayAmount;
    
    // --- Scale squash/stretch for impact feel ---
    const squash = 1.0 + Math.sin(animPhase * 2) * 0.03;
    playerModel.scale.set(3 / squash, 3 * squash, 3 / squash);
  } else if(playerModel) {
    // Idle — reset to neutral pose
    playerModel.position.y = playerPos.y;
    playerModel.rotation.y = characterYaw - Math.PI * 0.5;
    playerModel.rotation.x = 0;
    playerModel.rotation.z = 0;
    playerModel.scale.set(3, 3, 3);
  }
  
  // Update bass swimming — wandering pattern
  bassSwimData.forEach(function(data){
    if(data.model){
      data.time += dt;
      // Gentle direction changes on a timer
      data.turnTimer += dt;
      if(data.turnTimer >= data.turnInterval){
        data.turnTimer = 0;
        data.turnInterval = 3 + Math.random() * 5;
        data.turnTarget = data.heading + (Math.random() - 0.5) * Math.PI * 0.8;
      }
      // Smoothly rotate toward turn target
      var hDiff = data.turnTarget - data.heading;
      while(hDiff > Math.PI) hDiff -= 2*Math.PI;
      while(hDiff < -Math.PI) hDiff += 2*Math.PI;
      data.heading += hDiff * 0.02;
      // Move forward in heading direction
      var spd = data.swimSpeed * dt;
      data.model.position.x += Math.sin(data.heading) * spd;
      data.model.position.z += Math.cos(data.heading) * spd;
      // Keep in water — reverse heading if approaching land or world edge
      var wb = WORLD_SIZE * 0.45;
      var terrainH = getHeight(data.model.position.x, data.model.position.z);
      if(Math.abs(data.model.position.x) > wb || Math.abs(data.model.position.z) > wb || terrainH > -7){
        // Undo the move and reverse direction
        data.model.position.x -= Math.sin(data.heading) * spd;
        data.model.position.z -= Math.cos(data.heading) * spd;
        data.heading += Math.PI + (Math.random() - 0.5) * 0.5; // Reverse with slight randomness
        data.turnTarget = data.heading;
      }
      // Face swimming direction
      data.model.rotation.y = data.heading;
      // Gentle bobbing
      data.model.position.y = -7.75 + Math.sin(data.time * 1.5) * 0.15;
    }
  });
  
  // ===== DEER AI UPDATES (Rigged Animation) =====
  deerData.forEach(function(data){
    if(!data.model) return;
    data.time += dt;
    
    // Update animation mixer
    if(data.mixer) data.mixer.update(dt);
    
    // Helper: switch animation with crossfade
    function switchDeerAnim(newAnim){
      if(newAnim === data.currentAction) return;
      if(!data.actions[newAnim]) return;
      const oldAction = data.actions[data.currentAction];
      const newAction = data.actions[newAnim];
      if(oldAction) oldAction.fadeOut(0.3);
      newAction.reset().fadeIn(0.3).play();
      data.currentAction = newAnim;
    }
    
    const deerPos = data.model.position;
    const dx = playerPos.x - deerPos.x;
    const dz = playerPos.z - deerPos.z;
    const distToPlayer = Math.sqrt(dx*dx + dz*dz);
    
    // Check if player is close enough to spook
    if(distToPlayer < DEER_SPOOK_DISTANCE && data.state !== 'spooked'){
      data.state = 'spooked';
      data.spookTimer = 3 + Math.random() * 2;
      data.heading = Math.atan2(-dx, -dz);
      data.turnTarget = data.heading;
      switchDeerAnim('run');
    }
    
    if(data.state === 'spooked'){
      data.spookTimer -= dt;
      if(data.spookTimer <= 0){
        data.state = 'wandering';
        switchDeerAnim('walk');
      }
    }
    
    // Idle state — deer stands still, occasionally grazes
    if(data.state === 'idle'){
      data.idleTimer -= dt;
      if(data.idleTimer <= 0){
        data.state = 'wandering';
        data.turnInterval = 5 + Math.random() * 5;
        switchDeerAnim('walk');
      }
    }
    
    // Wandering — occasionally stop to idle/graze
    if(data.state === 'wandering'){
      data.turnTimer += dt;
      if(data.turnTimer >= data.turnInterval){
        data.turnTimer = 0;
        // 20% chance to stop and idle/graze
        if(Math.random() < 0.2){
          data.state = 'idle';
          data.idleTimer = 5 + Math.random() * 10;
          switchDeerAnim(Math.random() < 0.5 ? 'idle' : 'graze');
        } else {
          data.turnInterval = 5 + Math.random() * 5;
          data.turnTarget = data.heading + (Math.random() - 0.5) * Math.PI * 0.8;
        }
      }
    }
    
    // Movement speed based on state (idle = no movement)
    const currentSpeed = data.state === 'spooked' ? DEER_RUN_SPEED : (data.state === 'idle' ? 0 : data.walkSpeed);
    
    // Smooth heading toward target
    if(currentSpeed > 0){
      var hDiff = data.turnTarget - data.heading;
      while(hDiff > Math.PI) hDiff -= 2*Math.PI;
      while(hDiff < -Math.PI) hDiff += 2*Math.PI;
      data.heading += hDiff * (data.state === 'spooked' ? 0.1 : 0.03);
    }
    
    // Move forward
    if(currentSpeed > 0){
      const spd = currentSpeed * dt;
      const newX = deerPos.x + Math.sin(data.heading) * spd;
      const newZ = deerPos.z + Math.cos(data.heading) * spd;
      const newH = getHeight(newX, newZ);
      
      const wb = WORLD_SIZE * 0.45;
      if(Math.abs(newX) < wb && Math.abs(newZ) < wb && newH > -2 && newH < 28){
        // Align to slope + face heading direction
        const normal = getTerrainNormal(newX, newZ);
        const up = new THREE.Vector3(0, 1, 0);
        const slopeQuat = new THREE.Quaternion().setFromUnitVectors(up, normal);
        const yRotQuat = new THREE.Quaternion().setFromAxisAngle(up, data.heading + Math.PI);
        slopeQuat.multiply(yRotQuat);
        data.model.quaternion.copy(slopeQuat);
        deerPos.set(newX, newH, newZ);
        const deerUp = new THREE.Vector3(0, 0.05 * data.scale, 0);
        deerUp.applyQuaternion(slopeQuat);
        deerPos.add(deerUp);
      } else {
        data.heading += Math.PI + (Math.random() - 0.5) * 0.5;
        data.turnTarget = data.heading;
      }
    }
  });
  
  // ===== GRIZZLY BEAR AI UPDATES =====
  if(playerAttackCooldown > 0) playerAttackCooldown -= dt;
  
  bearData.forEach(function(bd, idx){
    if(!bd.model) return;
    bd.time += dt;
    
    // Dead bear — already swapped to dead model, just sit on ground
    if(bd.state === 'dead'){
      return;
    }
    
    // No color changes on hit — blood particles only
    
    const bearPos = bd.model.position;
    const dx = playerPos.x - bearPos.x;
    const dz = playerPos.z - bearPos.z;
    const distToPlayer = Math.sqrt(dx*dx + dz*dz);
    
    // Check aggro — bears CHARGE toward player
    if(distToPlayer < bd.variant.aggroRange && bd.state !== 'aggro' && bd.state !== 'attacking'){
      bd.state = 'aggro';
      bd.heading = Math.atan2(dx, dz);
      bd.turnTarget = bd.heading;
    }
    
    // De-aggro if player far enough away (2x aggro range)
    if((bd.state === 'aggro' || bd.state === 'attacking') && distToPlayer > bd.variant.aggroRange * 2){
      bd.state = 'wandering';
    }
    
    // Aggro — charge toward player
    if(bd.state === 'aggro'){
      bd.heading = Math.atan2(dx, dz);
      bd.turnTarget = bd.heading;
      
      if(distToPlayer < BEAR_ATTACK_RANGE){
        bd.state = 'attacking';
        bd.attackTimer = 0;
      }
    }
    
    // Attacking — deal damage to player on cooldown
    if(bd.state === 'attacking'){
      if(distToPlayer > BEAR_ATTACK_RANGE * 1.5){
        bd.state = 'aggro'; // Player moved away, chase again
      } else {
        bd.attackTimer -= dt;
        bd.heading = Math.atan2(dx, dz);
        if(bd.attackTimer <= 0){
          bd.attackTimer = bd.variant.attackCooldown;
          // Deal damage to player
          playerHP = Math.max(0, playerHP - bd.variant.damage);
          damageFlashTimer = 0.2;
          document.getElementById('damage-flash').style.display = 'block';
        }
      }
    }
    
    // Idle state
    if(bd.state === 'idle'){
      bd.idleTimer -= dt;
      if(bd.idleTimer <= 0){
        bd.state = 'wandering';
        bd.turnInterval = 4 + Math.random() * 4;
      }
    }
    
    // Wandering — occasionally stop
    if(bd.state === 'wandering'){
      bd.turnTimer += dt;
      if(bd.turnTimer >= bd.turnInterval){
        bd.turnTimer = 0;
        if(Math.random() < 0.15){
          bd.state = 'idle';
          bd.idleTimer = 3 + Math.random() * 6;
        } else {
          bd.turnInterval = 4 + Math.random() * 4;
          bd.turnTarget = bd.heading + (Math.random() - 0.5) * Math.PI * 0.8;
        }
      }
    }
    
    // Movement speed
    const bearSpeed = bd.state === 'aggro' ? BEAR_CHARGE_SPEED :
                      bd.state === 'attacking' ? 0 :
                      bd.state === 'idle' ? 0 : bd.walkSpeed;
    
    // Smooth heading
    if(bearSpeed > 0){
      var hDiff = bd.turnTarget - bd.heading;
      while(hDiff > Math.PI) hDiff -= 2*Math.PI;
      while(hDiff < -Math.PI) hDiff += 2*Math.PI;
      bd.heading += hDiff * (bd.state === 'aggro' ? 0.15 : 0.04);
    }
    
    // Move
    if(bearSpeed > 0){
      const spd = bearSpeed * dt;
      const newX = bearPos.x + Math.sin(bd.heading) * spd;
      const newZ = bearPos.z + Math.cos(bd.heading) * spd;
      const newH = getHeight(newX, newZ);
      
      const wb = WORLD_SIZE * 0.45;
      if(Math.abs(newX) < wb && Math.abs(newZ) < wb && newH > -2 && newH < 28){
        const normal = getTerrainNormal(newX, newZ);
        const up = new THREE.Vector3(0, 1, 0);
        const slopeQuat = new THREE.Quaternion().setFromUnitVectors(up, normal);
        const yRotQuat = new THREE.Quaternion().setFromAxisAngle(up, bd.heading + Math.PI);
        slopeQuat.multiply(yRotQuat);
        bd.model.quaternion.copy(slopeQuat);
        bearPos.set(newX, newH, newZ);
        const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(slopeQuat);
        bearPos.addScaledVector(localUp, BEAR_FOOT_OFFSET * bd.scale);
      } else {
        bd.heading += Math.PI + (Math.random() - 0.5) * 0.5;
        bd.turnTarget = bd.heading;
      }
    }
    
    // Procedural walking bob (whole body since no skeleton)
    if(bearSpeed > 0){
      bd.bobPhase += dt * (bd.state === 'aggro' ? 14 : 6);
      const bobAmount = (bd.state === 'aggro' ? 0.15 : 0.08) * bd.scale;
      bearPos.y += Math.abs(Math.sin(bd.bobPhase)) * bobAmount;
    }
  });
  
  // ===== SKINNING SYSTEM =====
  // Find nearest dead unskinned bear
  nearestDeadBear = -1;
  let nearestDeadDist = 8; // Must be within 8 units to skin
  for(let i = 0; i < bearData.length; i++){
    const bd = bearData[i];
    if(bd.state !== 'dead' || bd.skinned || bd.fadeTimer > 0) continue;
    if(bd.deathProgress < 1.0) continue; // Wait for collapse animation
    const dx = playerPos.x - bd.model.position.x;
    const dz = playerPos.z - bd.model.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if(dist < nearestDeadDist){
      nearestDeadDist = dist;
      nearestDeadBear = i;
    }
  }
  
  // Show/hide skin prompt
  const skinPrompt = document.getElementById('skin-prompt');
  const btnSkin = document.getElementById('btn-skin');
  if(nearestDeadBear >= 0 && skinningState === 'idle'){
    skinPrompt.style.display = 'block';
    document.getElementById('skin-prompt-text').textContent = isMobile ? 'Tap Skin' : 'Press E to Skin';
    document.getElementById('skin-progress-bar').style.display = 'none';
    if(isMobile) btnSkin.style.display = 'flex';
  } else if(skinningState !== 'skinning'){
    skinPrompt.style.display = 'none';
    btnSkin.style.display = 'none';
  }
  
  // Skinning progress
  if(skinningState === 'skinning'){
    // Cancel if moved too far from target
    const sbd = bearData[skinningTarget];
    if(sbd){
      const sdx = playerPos.x - sbd.model.position.x;
      const sdz = playerPos.z - sbd.model.position.z;
      const sdist = Math.sqrt(sdx*sdx + sdz*sdz);
      if(sdist > 10){
        cancelSkinning();
        showLootNotification('Too far away — skinning cancelled');
      } else {
        skinningProgress += dt / SKINNING_TIME;
        document.getElementById('skin-progress-fill').style.width = Math.min(100, skinningProgress * 100) + '%';
        skinPrompt.style.display = 'block';
        if(skinningProgress >= 1.0){
          completeSkinning();
        }
      }
    }
  }
  
  // Carcass timer — skinned bears stay 5 min then fade out over 3s
  for(let i = 0; i < bearData.length; i++){
    const bd = bearData[i];
    if(!bd.skinned || !bd.model) continue;
    // Count down carcass timer
    if(bd.carcassTimer > 0){
      bd.carcassTimer -= dt;
      if(bd.carcassTimer <= 0){
        bd.fadeTimer = 3.0; // Start 3-second fade
      }
      continue;
    }
    // Fade out after carcass timer expires
    if(bd.fadeTimer > 0){
      bd.fadeTimer -= dt;
      const opacity = Math.max(0, bd.fadeTimer / 3.0);
      bd.model.traverse(function(child){
        if(child.isMesh && child.material){
          child.material.transparent = true;
          child.material.opacity = opacity;
        }
      });
      if(bd.fadeTimer <= 0){
        scene.remove(bd.model);
        bd.model = null;
        bd.state = 'removed';
      }
    }
  }
  
  // ===== BLOOD PARTICLE PHYSICS =====
  for(let bi = 0; bi < bloodParticles.length; bi++){
    const bp = bloodParticles[bi];
    if(bp.life <= 0){ bp.mesh.visible = false; continue; }
    bp.life -= dt;
    // Gravity
    bp.vy -= 15 * dt;
    bp.mesh.position.x += bp.vx * dt;
    bp.mesh.position.y += bp.vy * dt;
    bp.mesh.position.z += bp.vz * dt;
    // Stop at terrain
    const groundH = getHeight(bp.mesh.position.x, bp.mesh.position.z);
    if(bp.mesh.position.y < groundH){
      bp.mesh.position.y = groundH;
      bp.vy = 0; bp.vx *= 0.3; bp.vz *= 0.3; // Splat on ground
    }
    // Fade out
    bp.mesh.material.opacity = Math.max(0, bp.life / bp.maxLife);
    if(bp.life <= 0) bp.mesh.visible = false;
  }
  
  // ===== DAMAGE FLASH TIMER =====
  if(damageFlashTimer > 0){
    damageFlashTimer -= dt;
    if(damageFlashTimer <= 0){
      document.getElementById('damage-flash').style.display = 'none';
    }
  }
  
  // Player HP regen (slow, 1 HP per 3 seconds when not taking damage)
  if(damageFlashTimer <= 0 && playerHP < playerMaxHP){
    playerHP = Math.min(playerMaxHP, playerHP + dt * 0.33);
  }
  
  // ===== LOOT DROP UPDATES =====
  for(let i = lootDrops.length - 1; i >= 0; i--){
    const loot = lootDrops[i];
    loot.timer -= dt;
    
    // Spin the loot marker
    if(loot.mesh) loot.mesh.rotation.y += dt * 2;
    // Bob up and down
    if(loot.mesh) loot.mesh.position.y = loot.position.y + Math.sin(Date.now() * 0.003) * 0.3;
    
    // Check if player is close enough to pick up
    const ldx = playerPos.x - loot.position.x;
    const ldz = playerPos.z - loot.position.z;
    const lootDist = Math.sqrt(ldx*ldx + ldz*ldz);
    if(lootDist < 4){
      pickupLoot(loot);
      lootDrops.splice(i, 1);
      continue;
    }
    
    // Expire loot after timer
    if(loot.timer <= 0){
      scene.remove(loot.mesh);
      lootDrops.splice(i, 1);
    }
  }
  
  // ===== LOOT NOTIFICATION TIMER =====
  if(lootNotifications.length > 0){
    lootNotifications[0].timer -= dt;
    if(lootNotifications[0].timer <= 0){
      lootNotifications.shift();
      if(lootNotifications.length > 0){
        document.getElementById('loot-popup').textContent = lootNotifications[0].text;
      } else {
        document.getElementById('loot-popup').style.display = 'none';
      }
    }
  }
  
  // ===== FISHING UPDATES =====
  if(fishingEquipped){
    updateFishingPolePosition();
    
    if(fishingState === 'casting'){
      fishingCastTime += dt;
      const castDuration = 0.6;
      
      if(fishingCastTime < castDuration){
        // Animate bobber flying through the air
        const castProgress = fishingCastTime / castDuration;
        const arc = Math.sin(castProgress * Math.PI) * 3;  // Arc up then down
        
        fishingBobber.position.x = castStartPos.x + (bobberX - castStartPos.x) * castProgress;
        fishingBobber.position.y = castStartPos.y - 1 + arc;
        fishingBobber.position.z = castStartPos.z + (bobberZ - castStartPos.z) * castProgress;
      } else {
        // Bobber lands in water
        fishingBobber.position.set(bobberX, -6, bobberZ);
        fishingState = 'waiting';
        fishingStartTime = clock.elapsedTime;
        
        // Look for fish near bobber
        nearbyFish = findFishNearBobber();
        if(nearbyFish){
          fishNpcId = nearbyFish.data.npcId;
          fishSizeMultiplier = nearbyFish.data.sizeMultiplier;
          fishArrivalTime = 2 + Math.random() * 2;  // Fish takes 2-4 seconds to arrive
        }
      }
    }
    
    if(fishingState === 'waiting'){
      fishCaughtTime = clock.elapsedTime - fishingStartTime;
      
      // Bobber bobs up and down
      const bobAmplitude = 0.3;
      fishingBobber.position.y = -6 + Math.sin(fishCaughtTime * 3) * bobAmplitude * 0.3;
      
      // If fish found, swim towards bobber
      if(nearbyFish && fishCaughtTime < fishArrivalTime){
        const fish = nearbyFish.data;
        const dx = bobberX - fish.model.position.x;
        const dz = bobberZ - fish.model.position.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        
        if(dist > 0.5){
          const speed = 20 * dt;  // Swim speed
          fish.model.position.x += (dx / dist) * speed;
          fish.model.position.z += (dz / dist) * speed;
          fish.model.position.y = -6 + Math.random() * 1;
        }
      }
      
      // Once fish arrives, bobber bobs more vigorously
      if(nearbyFish && fishCaughtTime >= fishArrivalTime){
        const bigBobAmount = 0.5 + Math.sin(fishCaughtTime * 6) * 0.3;
        fishingBobber.position.y = -6 + bigBobAmount;
      }
    }
    
    // Update fishing line from pole tip to bobber
    if(fishingState === 'casting' || fishingState === 'waiting'){
      const linePositions = fishingLineGeometry.attributes.position.array;
      // Pole tip
      linePositions[0] = fishingPole.position.x;
      linePositions[1] = fishingPole.position.y;
      linePositions[2] = fishingPole.position.z;
      // Bobber
      linePositions[3] = fishingBobber.position.x;
      linePositions[4] = fishingBobber.position.y;
      linePositions[5] = fishingBobber.position.z;
      fishingLineGeometry.attributes.position.needsUpdate = true;
    }
  }
  
  if(thirdPerson){
    const camX = playerPos.x - Math.sin(playerYaw)*Math.cos(cameraPitch)*cameraDistance;
    const camY = playerPos.y + 2 + Math.sin(cameraPitch)*cameraDistance;
    const camZ = playerPos.z - Math.cos(playerYaw)*Math.cos(cameraPitch)*cameraDistance;
    camera.position.set(camX, camY, camZ);
    camera.lookAt(playerPos.x, playerPos.y+1.5, playerPos.z);
  } else {
    camera.position.set(playerPos.x, playerPos.y+1.7, playerPos.z);
    const lookDist = 10;
    camera.lookAt(
      playerPos.x + Math.sin(playerYaw)*lookDist,
      playerPos.y + 1.7 + Math.sin(cameraPitch)*lookDist,
      playerPos.z + Math.cos(playerYaw)*lookDist
    );
  }
  
  // Sun stays fixed in world, doesn't follow player
  sunLight.target.position.set(400, 200, 300);
  
  water.position.y = -6 + Math.sin(clock.elapsedTime*0.5)*0.3;
  
  // Animate water texture — scroll in two directions for ripple effect
  if(water.material.map){
    water.material.map.offset.x += 0.001;
    water.material.map.offset.y += 0.0008;
  }
  
  document.getElementById('hud-pos').textContent = 'Position: '+Math.round(playerPos.x)+', '+Math.round(playerPos.y)+', '+Math.round(playerPos.z);
  document.getElementById('hud-fps').textContent = 'FPS: '+fps;
  document.getElementById('hud-mode').textContent = 'Camera: '+(thirdPerson?'3rd Person':'1st Person');
  document.getElementById('hud-pos').textContent += ' | Fishing: '+Math.round(playerSkills.fishing)+' | Caught: '+playerCaughtFish;
  
  // Update HP bar
  const hpPct = Math.max(0, playerHP / playerMaxHP * 100);
  document.getElementById('hp-bar').style.width = hpPct + '%';
  document.getElementById('hp-text').textContent = Math.round(playerHP) + ' / ' + playerMaxHP + ' HP';
  if(hpPct > 50) document.getElementById('hp-bar').style.background = 'linear-gradient(to bottom,#4f4,#2a2)';
  else if(hpPct > 25) document.getElementById('hp-bar').style.background = 'linear-gradient(to bottom,#ff4,#aa2)';
  else document.getElementById('hp-bar').style.background = 'linear-gradient(to bottom,#f44,#a22)';
  
  // Show XP and inventory items
  var invText = ' | XP: ' + playerXP;
  var invItems = Object.keys(playerInventory);
  if(invItems.length > 0){
    invText += ' | Loot: ';
    invItems.forEach(function(item){ invText += item + '(' + playerInventory[item] + ') '; });
  }
  document.getElementById('hud-mode').textContent += invText;
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
