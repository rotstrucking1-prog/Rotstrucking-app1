<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exclusive Content 🔥</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0d0d12;font-family:Arial,Helvetica,sans-serif;color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:520px}
  .blue{color:#00aff0;font-weight:800;font-size:2.2em;letter-spacing:-1px}
  .big{font-size:1.9em;font-weight:800;line-height:1.25;margin:28px 0 10px}
  .sub{font-size:1.25em;color:#bbb;margin-top:18px}
  .zing{margin-top:34px;font-size:1.05em;color:#ff8c1a;font-style:italic}
  .lock{font-size:3.5em;margin-bottom:6px}
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔓</div>
  <div class="blue">Exclusive Content Unlocked</div>
  <div class="big">I'm NOT interested in your dispatch services.</div>
  <div class="sub">Leave me alone.</div>
  <div class="zing">…and by the way — why did you click? 👀</div>
</div>
</body>
</html>
