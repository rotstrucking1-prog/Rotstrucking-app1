<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OSRS Slayer Monster Map — Real World Overlay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#controls {
  background: #16213e; padding: 8px 12px; display: flex; gap: 10px; align-items: center;
  border-bottom: 2px solid #0f3460; flex-wrap: wrap; z-index: 1000;
}
#controls input, #controls select {
  background: #1a1a2e; color: #e0e0e0; border: 1px solid #0f3460;
  padding: 6px 10px; border-radius: 4px; font-size: 13px;
}
#controls label { font-size: 12px; color: #aaa; }
#controls button {
  background: #e94560; color: white; border: none; padding: 6px 12px;
  border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
}
#controls button:hover { background: #c73e54; }

#map { flex: 1; background: #0a0a1a; }
.leaflet-container { background: #0a0a1a; }

.monster-label {
  background: rgba(22, 33, 62, 0.92);
  border: 2px solid #e94560;
  border-radius: 6px;
  padding: 4px 8px;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 0 4px rgba(233, 69, 96, 0.6);
  box-shadow: 0 0 8px rgba(233, 69, 96, 0.3);
  text-align: center;
  line-height: 1.3;
}
.monster-label.underground {
  border-color: #ff8c00;
  text-shadow: 0 0 4px rgba(255, 140, 0, 0.6);
  box-shadow: 0 0 8px rgba(255, 140, 0, 0.3);
}
.monster-label.turael {
  border-color: #4ade80;
  text-shadow: 0 0 4px rgba(74, 222, 128, 0.6);
  box-shadow: 0 0 8px rgba(74, 222, 128, 0.3);
}
.monster-label.high-slayer {
  border-color: #ffd700;
  text-shadow: 0 0 4px rgba(255, 215, 0, 0.6);
  box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
}
.monster-label.wrong {
  border-color: #ff0000;
  text-shadow: 0 0 4px rgba(255, 0, 0, 0.6);
  box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
  animation: pulse-red 1.5s ease-in-out infinite;
}
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 8px rgba(255, 0, 0, 0.3); }
  50% { box-shadow: 0 0 16px rgba(255, 0, 0, 0.7); }
}

.monster-popup { font-size: 13px; line-height: 1.6; }
.monster-popup .name { font-weight: bold; font-size: 15px; color: #e94560; }
.monster-popup .field { color: #666; }
.monster-popup .val { color: #222; font-weight: 500; }
.monster-popup .coords { font-family: monospace; color: #0066cc; font-weight: 600; }
.monster-popup .warn { color: #ff0000; font-weight: 700; }

.legend { display: flex; gap: 12px; font-size: 11px; align-items: center; flex-wrap: wrap; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 3px; vertical-align: middle; }

#count { color: #666; font-size: 11px; }
#coordDisplay { color: #4ade80; font-family: monospace; font-size: 12px; min-width: 140px; }
</style>
</head>
<body>

<div id="controls">
  <input type="text" id="search" placeholder="Search monster..." style="width:180px"/>
  <select id="filter">
    <option value="all">All Monsters</option>
    <option value="surface">Surface Only</option>
    <option value="underground">Underground Only</option>
    <option value="turael">Turael Tasks</option>
    <option value="wrong">⚠️ Flagged Wrong</option>
  </select>
  <button id="resetBtn">Reset View</button>
  <span id="count"></span>
  <span id="coordDisplay">Hover for coords</span>
  <div class="legend">
    <span><span class="legend-dot" style="background:#4ade80"></span>Turael</span>
    <span><span class="legend-dot" style="background:#ff8c00"></span>Underground</span>
    <span><span class="legend-dot" style="background:#ffd700"></span>High Slayer</span>
    <span><span class="legend-dot" style="background:#e94560"></span>Normal</span>
    <span><span class="legend-dot" style="background:#ff0000"></span>⚠️ Flagged</span>
  </div>
</div>

<div id="map"></div>

<script>
// === OSRS coordinate conversion (from Explv's Position.js) ===
var MAP_H = 364544;
var TILE_PX = 32;
var OFF_X = 960;
var OFF_Y = 6208;
var MAX_Z = 11;

function gameToLatLng(map, gx, gy) {
  var px = ((gx - OFF_X) * TILE_PX) + (TILE_PX / 4);
  var py = MAP_H - ((gy - OFF_Y) * TILE_PX);
  return map.unproject(L.point(px, py), MAX_Z);
}

function latLngToGame(map, latlng) {
  var pt = map.project(latlng, MAX_Z);
  var gy = MAP_H - pt.y + (TILE_PX / 4);
  gy = Math.round((gy - TILE_PX) / TILE_PX) + OFF_Y;
  var gx = Math.round((pt.x - TILE_PX) / TILE_PX) + OFF_X;
  return { x: gx, y: gy };
}

// === Turael task list ===
var TURAEL_TASKS = [
  "Banshee", "Bat", "Bear", "Bird", "Cave Bug", "Cave Crawler", "Cave Slime",
  "Cow", "Crawling Hand", "Desert Lizard", "Dog", "Dwarf", "Ghost", "Goblin",
  "Icefiend", "Kalphite Worker", "Lizard", "Minotaur", "Monkey", "Rat",
  "Scorpion", "Skeleton", "Spider", "Wolf", "Zombie"
];

// === Known issues to flag ===
var FLAGGED_MONSTERS = {
  "Wolf": "⚠️ Coords (2857,3553) = Warriors Guild area, NOT White Wolf Mountain. Should be ~(2848,3500)",
  "Bird": "⚠️ Y=9572 is underground coords for Lumbridge — birds are surface",
  "Cow": "⚠️ Y=9572 is underground — cows are on surface near Lumbridge",
  "Goblin": "⚠️ Y=9572 is underground — goblins are on surface near Lumbridge",
  "Spider": "⚠️ Y=9572 is underground — spiders on surface too"
};

// === Monster data (loaded from JSON) ===
var MONSTERS = [];

function initMap() {
  var map = L.map('map', {
    zoomControl: true,
    renderer: L.canvas()
  });

  // OSRS tile layer from Explv's repo
  var tileLayer = L.tileLayer('https://raw.githubusercontent.com/Explv/osrs_map_tiles/master/0/{z}/{x}/{y}.png', {
    minZoom: 4,
    maxZoom: 11,
    maxNativeZoom: 11,
    attribution: 'Map data &copy; Jagex | Tiles by Explv',
    noWrap: true,
    tms: true
  });
  tileLayer.addTo(map);

  // Default view: center on main game area
  var center = gameToLatLng(map, 3100, 3400);
  map.setView(center, 7);

  // Coordinate display on hover
  map.on('mousemove', function(e) {
    var g = latLngToGame(map, e.latlng);
    document.getElementById('coordDisplay').textContent = '(' + g.x + ', ' + g.y + ')';
  });

  var markers = [];
  var markerLayer = L.layerGroup().addTo(map);

  function isTurael(name) {
    for (var i = 0; i < TURAEL_TASKS.length; i++) {
      if (TURAEL_TASKS[i] === name) return true;
    }
    return false;
  }

  function isUnderground(y) { return y > 5000; }

  function getClass(m) {
    if (FLAGGED_MONSTERS[m.name]) return 'wrong';
    if (isTurael(m.name)) return 'turael';
    if (isUnderground(m.y)) return 'underground';
    if (m.slayerLevel >= 60) return 'high-slayer';
    return '';
  }

  function renderMonsters(filterVal, searchVal) {
    markerLayer.clearLayers();
    markers = [];
    var count = 0;
    var searchLow = (searchVal || '').toLowerCase();

    for (var i = 0; i < MONSTERS.length; i++) {
      var m = MONSTERS[i];

      // Filter
      if (filterVal === 'surface' && isUnderground(m.y)) continue;
      if (filterVal === 'underground' && !isUnderground(m.y)) continue;
      if (filterVal === 'turael' && !isTurael(m.name)) continue;
      if (filterVal === 'wrong' && !FLAGGED_MONSTERS[m.name]) continue;

      // Search
      if (searchLow && m.name.toLowerCase().indexOf(searchLow) === -1 &&
          m.locationName.toLowerCase().indexOf(searchLow) === -1) continue;

      var ll = gameToLatLng(map, m.x, m.y);
      var cls = getClass(m);
      var flagNote = FLAGGED_MONSTERS[m.name] || '';

      var label = L.marker(ll, {
        icon: L.divIcon({
          className: 'monster-label ' + cls,
          html: (flagNote ? '⚠️ ' : '') + m.name + '<br><span style="font-size:10px;opacity:0.7">' + m.locationName + '</span>',
          iconSize: null,
          iconAnchor: [0, 0]
        })
      });

      var popupHtml = '<div class="monster-popup">' +
        '<div class="name">' + m.name + '</div>' +
        '<span class="field">Location:</span> <span class="val">' + m.locationName + '</span><br>' +
        '<span class="field">Game Coords:</span> <span class="coords">(' + m.x + ', ' + m.y + ')</span><br>' +
        '<span class="field">Combat:</span> <span class="val">' + m.combatLevel + '</span> | ' +
        '<span class="field">Slayer:</span> <span class="val">' + m.slayerLevel + '</span><br>' +
        '<span class="field">NPC IDs:</span> <span class="val">' + m.npcIds + '</span>';
      if (flagNote) {
        popupHtml += '<br><br><span class="warn">' + flagNote + '</span>';
      }
      popupHtml += '</div>';

      label.bindPopup(popupHtml, { maxWidth: 350 });
      label.addTo(markerLayer);
      markers.push(label);
      count++;
    }

    document.getElementById('count').textContent = count + ' / ' + MONSTERS.length + ' shown';
  }

  // Controls
  document.getElementById('search').addEventListener('input', function() {
    renderMonsters(document.getElementById('filter').value, this.value);
  });
  document.getElementById('filter').addEventListener('change', function() {
    renderMonsters(this.value, document.getElementById('search').value);
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    document.getElementById('search').value = '';
    document.getElementById('filter').value = 'all';
    map.setView(center, 7);
    renderMonsters('all', '');
  });

  // Initial render
  renderMonsters('all', '');
}

// Load monster data
var xhr = new XMLHttpRequest();
xhr.open('GET', 'monsters.json', true);
xhr.onload = function() {
  if (xhr.status === 200) {
    MONSTERS = JSON.parse(xhr.responseText);
    initMap();
  }
};
xhr.send();
</script>
</body>
</html>
