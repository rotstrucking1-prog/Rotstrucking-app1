body { background:#1a1a2e; color:#eee; font-family:'Segoe UI',sans-serif; overflow:hidden; }

#sidebar { position:absolute; top:0; left:0; width:320px; bottom:0; background:#16213e; overflow-y:auto; z-index:1000; border-right:2px solid #e94560; }

.monster-item:hover { background:#1a1a2e; }
.monster-item.selected { background:#e94560; color:#fff; }
.monster-item .count { font-size:11px; opacity:0.7; }
#info-panel { display:none; padding:10px; background:#0f3460; margin:8px; border-radius:6px; border:1px solid #e94560; max-height:300px; overflow-y:auto; }
#info-panel h3 { color:#e94560; margin-bottom:4px; font-size:14px; }
#info-panel .info-row { font-size:12px; margin:2px 0; }
#info-panel .info-row span { color:#aaa; }
#info-panel a { color:#60a5fa; }

.filter-row { padding:4px 8px; display:flex; gap:3px; flex-wrap:wrap; justify-content:center; border-bottom:1px solid #333; }
.fbtn { padding:3px 7px; border:1px solid; border-radius:3px; cursor:pointer; font-size:10px; font-weight:bold; background:transparent; color:#ccc; border-color:#555; }
.fbtn.active { color:#fff; }
.surface-toggle { padding:4px 8px; text-align:center; border-bottom:1px solid #333; }
.surface-toggle label { font-size:11px; cursor:pointer; color:#aaa; }
.surface-toggle input { margin-right:4px; }
#toggle-sidebar { display:none; position:absolute; top:10px; left:10px; z-index:1001; background:#e94560; border:none; color:#fff; padding:8px 12px; border-radius:4px; cursor:pointer; font-size:16px; }
@media (max-width:768px) {
  #sidebar { width:100%; height:45%; bottom:auto; }
  #map { top:45%; left:0; }

  #sidebar.hidden { display:none; }
  #sidebar.hidden ~ #map { top:0; left:0; }

// Explv coordinate constants (from Position.js)
var MAP_HEIGHT_PX = 364544;
var TILE_PX = 32;
var OFFSET_X = 960;  // 1024 - 64
var OFFSET_Y = 6208;

// Level-based colors
function getLevelColor(lvlStr) {
  var n = parseInt(lvlStr) || 1;
  if (n < 30) return '#4ade80';
  if (n < 60) return '#22d3ee';
  if (n < 100) return '#60a5fa';
  if (n < 150) return '#f59e0b';
  if (n < 200) return '#ef4444';
  return '#a855f7';
}

// Build map with Explv tiles
var map = L.map('map', {
  zoomControl: true,
  renderer: L.canvas(),
  minZoom: 4,
  maxZoom: 11
});

L.tileLayer('https://raw.githubusercontent.com/Explv/osrs_map_tiles/master/0/{z}/{x}/{y}.png', {
  minZoom: 4,
  maxZoom: 11,
  attribution: 'Map: Explv | Data: OSRS Wiki',
  noWrap: true,
  tms: true
}).addTo(map);

// Explv coordinate conversion: game tile -> leaflet LatLng
function gameToLatLng(gx, gy) {
  var px = ((gx - OFFSET_X) * TILE_PX) + (TILE_PX / 4);
  var py = MAP_HEIGHT_PX - ((gy - OFFSET_Y) * TILE_PX);
  return map.unproject(L.point(px, py), 11);
}

// Set initial view (same as Explv default)
map.setView([-79, -137], 7);

// State
var selectedMonster = null;
var showUnderground = true;

// Create spawn markers for each monster
function createMarkers() {
  for (var i = 0; i < MONSTERS.length; i++) {
    var m = MONSTERS[i];
    m._layers = [];
    for (var j = 0; j < m.spawns.length; j++) {
      var s = m.spawns[j];
      var color = getLevelColor(s.levels || '1');
      var isUnderground = (s.plane > 0 || s.y > 9000 || (s.mapID && s.mapID !== 0));
      
      var sw = gameToLatLng(s.x, s.y);
      var ne = gameToLatLng(s.x + 1, s.y + 1);
      
      var rect = L.rectangle(L.latLngBounds(sw, ne), {
        color: isUnderground ? '#fff' : color,
        fillColor: color,
        fillOpacity: 0.7,
        weight: isUnderground ? 2 : 1,
        opacity: 0.9,
        dashArray: isUnderground ? '3,3' : null
      });
      
      var ug = isUnderground ? ' [Underground]' : '';
      var mem = s.members ? ' (P2P)' : ' (F2P)';
      rect.bindTooltip(
        '<b>' + m.name + '</b> (Lvl ' + (s.levels || '?') + ')' + mem + ug +
        '<br>' + (s.area || 'Unknown') +
        '<br>Tile: (' + s.x + ', ' + s.y + ')' +
        (s.plane > 0 ? ' | Plane ' + s.plane : ''),
        { sticky: true }
      );
      
      rect._isUnderground = isUnderground;
      rect._monsterIdx = i;
      rect.addTo(map);
      m._layers.push(rect);
    }
  }
}

createMarkers();

// Stats
var totalSpawns = 0;
for (var i = 0; i < MONSTERS.length; i++) totalSpawns += MONSTERS[i].spawns.length;
document.getElementById('stats-bar').textContent = MONSTERS.length + ' monsters | ' + totalSpawns.toLocaleString() + ' wiki-verified spawn tiles';

// Legend
var legendColors = [
  ['#4ade80','1-29'], ['#22d3ee','30-59'], ['#60a5fa','60-99'],
  ['#f59e0b','100-149'], ['#ef4444','150-199'], ['#a855f7','200+']
];
var legendEl = document.getElementById('legend');
for (var c = 0; c < legendColors.length; c++) {
  var le = document.createElement('div');
  le.className = 'legend-item';
  le.innerHTML = '<div class="legend-dot" style="background:' + legendColors[c][0] + '"></div>Lvl ' + legendColors[c][1];
  legendEl.appendChild(le);
}

// Underground toggle
document.getElementById('show-underground').addEventListener('change', function() {
  showUnderground = this.checked;
  updateVisibility();
});

function updateVisibility() {
  for (var i = 0; i < MONSTERS.length; i++) {
    for (var j = 0; j < MONSTERS[i]._layers.length; j++) {
      var layer = MONSTERS[i]._layers[j];
      if (!showUnderground && layer._isUnderground) {
        layer.setStyle({ fillOpacity: 0, opacity: 0 });
      } else if (selectedMonster !== null && selectedMonster !== i) {
        layer.setStyle({ fillOpacity: 0.05, opacity: 0.05 });
      } else {
        layer.setStyle({ fillOpacity: 0.7, opacity: 0.9 });
      }
    }
  }
}

// Monster list
function buildList() {
  var listEl = document.getElementById('monster-list');
  listEl.innerHTML = '';
  var search = (document.getElementById('search').value || '').toLowerCase();
  
  for (var i = 0; i < MONSTERS.length; i++) {
    var m = MONSTERS[i];
    if (search && m.name.toLowerCase().indexOf(search) === -1) continue;
    
    var div = document.createElement('div');
    div.className = 'monster-item' + (selectedMonster === i ? ' selected' : '');
    div.innerHTML = '<span>' + m.name + '</span><span class="count">' + m.spawns.length + ' tiles</span>';
    div.setAttribute('data-idx', String(i));
    div.onclick = function() {
      selectMonster(parseInt(this.getAttribute('data-idx')));
    };
    listEl.appendChild(div);
  }
}

function selectMonster(idx) {
  var panel = document.getElementById('info-panel');
  
  if (selectedMonster === idx) {
    selectedMonster = null;
    panel.style.display = 'none';
    updateVisibility();
    buildList();
    return;
  }
  
  selectedMonster = idx;
  var m = MONSTERS[idx];
  
  // Dim all others
  updateVisibility();
  
  // Zoom to selected monster (surface spawns only if possible)
  var surfaceLayers = [];
  for (var j = 0; j < m._layers.length; j++) {
    if (!m._layers[j]._isUnderground) surfaceLayers.push(m._layers[j]);
  }
  var zoomLayers = surfaceLayers.length > 0 ? surfaceLayers : m._layers;
  if (zoomLayers.length > 0) {
    var group = L.featureGroup(zoomLayers);
    map.fitBounds(group.getBounds().pad(0.3));
  }
  
  // Info panel
  panel.style.display = 'block';
  document.getElementById('info-name').textContent = m.name;
  
  // Group by area
  var areas = {};
  for (var j = 0; j < m.spawns.length; j++) {
    var s = m.spawns[j];
    var key = (s.area || 'Unknown') + '|' + (s.levels || '?');
    if (!areas[key]) areas[key] = { area: s.area, levels: s.levels, tiles: [] };
    areas[key].tiles.push(s);
  }
  
  var html = '<div class="info-row"><a href="https://oldschool.runescape.wiki/w/' + encodeURIComponent(m.wikiPage) + '" target="_blank">Open Wiki Page</a></div>';
  html += '<div class="info-row"><span>Slayer Level:</span> ' + (m.slayerLevel || 1) + '</div>';
  html += '<div class="info-row"><span>Total Spawns:</span> ' + m.spawns.length + '</div>';
  if (m.npcIds && m.npcIds.length) html += '<div class="info-row"><span>NPC IDs:</span> ' + m.npcIds.join(', ') + '</div>';
  html += '<hr style="border-color:#333;margin:6px 0">';
  
  var keys = Object.keys(areas);
  for (var k = 0; k < keys.length; k++) {
    var a = areas[keys[k]];
    html += '<div class="info-row"><b>' + (a.area || 'Unknown') + '</b> (Lvl ' + (a.levels || '?') + ') — ' + a.tiles.length + ' tiles</div>';
    for (var t = 0; t < Math.min(a.tiles.length, 4); t++) {
      html += '<div class="info-row" style="padding-left:10px;font-size:11px;color:#777">(' + a.tiles[t].x + ', ' + a.tiles[t].y + ')</div>';
    }
    if (a.tiles.length > 4) html += '<div class="info-row" style="padding-left:10px;font-size:11px;color:#555">+' + (a.tiles.length-4) + ' more</div>';
  }
  
  document.getElementById('info-body').innerHTML = html;
  buildList();
}

// Coordinate display
map.on('mousemove', function(e) {
  var pt = map.project(e.latlng, 11);
  var gx = Math.floor(((pt.x - (TILE_PX/4)) / TILE_PX) + OFFSET_X);
  var gy = Math.floor(((MAP_HEIGHT_PX - pt.y) / TILE_PX) + OFFSET_Y);
  document.getElementById('coord-display').textContent = 'Tile: (' + gx + ', ' + gy + ')';
});

// Search
document.getElementById('search').addEventListener('input', buildList);

buildList();
</script>
</body>
</html>
