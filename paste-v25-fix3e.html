<!DOCTYPE html><html><head><meta charset="utf-8"><title>ROTS Bot v25-Fix3e — Paste Page</title>
<style>body{font-family:Arial,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:20px;max-width:900px;margin:0 auto}
h1{color:#00d4ff;text-align:center}h2{color:#ffd700;margin-top:30px}
.tab{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:15px;margin:10px 0}
textarea{width:100%;height:200px;background:#0a0a1a;color:#00ff88;border:1px solid #333;font-family:monospace;font-size:11px;padding:10px;border-radius:4px}
.btn{background:linear-gradient(135deg,#0066ff,#00d4ff);color:#fff;border:none;padding:15px 40px;font-size:18px;border-radius:8px;cursor:pointer;display:block;margin:10px auto;font-weight:bold}
.btn:hover{transform:scale(1.05)}.btn:active{background:#00aa00}
.info{background:#1a3a1a;border:1px solid #00ff88;padding:10px;border-radius:5px;margin:10px 0;text-align:center}
.warn{background:#3a2a1a;border:1px solid #ffd700;padding:10px;border-radius:5px;margin:10px 0}
</style></head><body>
<h1>🤖 ROTS Bot v25-Fix3e</h1>
<div class="warn">⚠️ BOTH TABS CHANGED — paste MAIN then UTILITIES</div>
<div class="info">✅ Closest location routing + !pause/!here spawn override + duplicate var fix</div>

<h2>📋 Tab 1: MAIN</h2>
<div class="tab">
<button class="btn" onclick="copyTab('main')">📋 COPY MAIN</button>
<textarea id="main" readonly>LOADING...</textarea>
</div>

<h2>📋 Tab 2: UTILITIES</h2>
<div class="tab">
<button class="btn" onclick="copyTab('util')">📋 COPY UTILITIES</button>
<textarea id="util" readonly>LOADING...</textarea>
</div>

<div class="info" id="status">Loading code from GitHub...</div>

<script>
var base='https://raw.githubusercontent.com/rotstrucking1-prog/Rotstrucking-app1/main/';
function loadFile(id,file){
fetch(base+file+'?t='+Date.now()).then(function(r){return r.text()}).then(function(t){
document.getElementById(id).value=t;
document.getElementById('status').textContent='✅ Code loaded — ready to copy!';
}).catch(function(e){document.getElementById(id).value='ERROR: '+e});}
function copyTab(id){
var ta=document.getElementById(id);ta.select();document.execCommand('copy');
var b=event.target;b.textContent='✅ COPIED!';b.style.background='#00aa00';
setTimeout(function(){b.textContent=id==='main'?'📋 COPY MAIN':'📋 COPY UTILITIES';b.style.background='';},2000);}
loadFile('main','slayer_MAIN_v25.txt');
loadFile('util','slayer_UTILITIES_v25.txt');
</script></body></html>
